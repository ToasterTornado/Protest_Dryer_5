<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Advice for {{ destination }}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="header">
        <h1>SUSTAINABLE<br>TRIP ADVISOR</h1>
    </div>
    <div class="container">
        <h2>Your Trip to {{ destination }}</h2>
        
        {% if places %}
        <div class="places-section">
            <h3>Recommended Places</h3>
            
            <!-- Map Container -->
            <div id="map" style="height: 400px; width: 100%; margin-bottom: 20px; border-radius: 8px;"></div>

            <div class="places-grid">
                {% for place in places %}
                <div class="place-card">
                    <div class="place-type">{{ place.type }}</div>
                    <h4>{{ place.name }}</h4>
                    <p>{{ place.description }}</p>
                </div>
                {% endfor %}
            </div>
        </div>

        <script>
            function initMap() {
                const places = [
                    {% for place in places %}
                    {
                        name: "{{ place.name }}",
                        lat: {{ place.coordinates.lat if place.coordinates else 0 }},
                        lng: {{ place.coordinates.lng if place.coordinates else 0 }}
                    },
                    {% endfor %}
                ];

                // Filter out places with invalid coordinates
                const validPlaces = places.filter(p => p.lat !== 0 && p.lng !== 0);

                if (validPlaces.length === 0) return;

                // Center map on the first place
                const center = { lat: validPlaces[0].lat, lng: validPlaces[0].lng };
                
                const map = new google.maps.Map(document.getElementById("map"), {
                    zoom: 12,
                    center: center,
                });

                validPlaces.forEach(place => {
                    new google.maps.Marker({
                        position: { lat: place.lat, lng: place.lng },
                        map: map,
                        title: place.name,
                    });
                });
            }
        </script>
        <!-- Replace YOUR_API_KEY with your actual Google Maps API key -->
        <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCzpCmUn2vcDm8W0N_wTC47n8ZPX27vj9k&callback=initMap" async defer></script>
        {% endif %}

        <div class="result-content">
            {{ advice | safe }}
        </div>

        <div class="actions">
            <a href="/" class="button-link">Plan Another Trip</a>
        </div>
    </div>
</body>
</html>
