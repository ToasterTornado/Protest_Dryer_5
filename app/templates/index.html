<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco-Conscious Travel Advisor</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <h1>🌿 Eco-Conscious Travel Advisor</h1>
        <form action="/advice" method="post" onsubmit="document.getElementById('loading').style.display='block'">
            <div class="form-group">
                <label for="destination">Destination:</label>
                <input type="text" id="destination" name="destination" required placeholder="e.g., Costa Rica">
            </div>
            <div class="form-group">
                <label for="duration">Duration:</label>
                <input type="text" id="duration" name="duration" required placeholder="e.g., 2 weeks">
            </div>
            <div class="form-group">
                <label for="people_count">Number of Travelers:</label>
                <input type="number" id="people_count" name="people_count" required min="1" value="1">
            </div>
            <button type="submit">Get Eco Advice</button>
        </form>

        <div id="loading" class="loading">Consulting the AI advisor... please wait...</div>

        {% if advice %}
        <div class="result">
            <h2>Travel Advice for {{ destination }}</h2>
            <div>{{ advice }}</div>
        </div>
        {% endif %}
    </div>
</body>
</html>
